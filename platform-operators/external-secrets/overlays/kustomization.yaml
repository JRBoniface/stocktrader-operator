# ----------------------------------------------------------------------------------
# EXTERNAL SECRETS OPERATOR — OVERLAY
# ----------------------------------------------------------------------------------
# Extends the base with cluster-specific values sourced from eso-config.yaml.
#
# eso-config.yaml is a committed ConfigMap containing infrastructure coordinates
# (tenant ID, Key Vault URI, namespace names). These are not credentials — actual
# secrets live in Azure Key Vault. The matching ConfigMap on the cluster is
# provisioned by Terraform (providers/azure/modules/external_secrets).
#
# When infrastructure changes, update eso-config.yaml AND re-run terraform apply.
# ----------------------------------------------------------------------------------
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
  - external-secret.yaml
  - eso-config.yaml

# Injects values from eso-config ConfigMap into ClusterSecretStore and ExternalSecret fields.
# eso-config.yaml is committed to git so ArgoCD can render this overlay without a local
# config.env file. The matching ConfigMap on the cluster is provisioned by Terraform.
replacements:
  - source:
      kind: ConfigMap
      name: eso-config
      fieldPath: data.TENANT_ID
    targets:
      - select:
          kind: ClusterSecretStore
          name: azure-kv
        fieldPaths:
          - spec.provider.azurekv.tenantId

  - source:
      kind: ConfigMap
      name: eso-config
      fieldPath: data.KEY_VAULT_URI
    targets:
      - select:
          kind: ClusterSecretStore
          name: azure-kv
        fieldPaths:
          - spec.provider.azurekv.vaultUrl

  - source:
      kind: ConfigMap
      name: eso-config
      fieldPath: data.SERVICE_ACCOUNT_NAME
    targets:
      - select:
          kind: ClusterSecretStore
          name: azure-kv
        fieldPaths:
          - spec.provider.azurekv.serviceAccountRef.name

  - source:
      kind: ConfigMap
      name: eso-config
      fieldPath: data.ESO_NAMESPACE
    targets:
      - select:
          kind: ClusterSecretStore
          name: azure-kv
        fieldPaths:
          - spec.provider.azurekv.serviceAccountRef.namespace

  - source:
      kind: ConfigMap
      name: eso-config
      fieldPath: data.CREDENTIALS_SECRET_NAME
    targets:
      - select:
          kind: ExternalSecret
        fieldPaths:
          - metadata.name
          - spec.target.name

  - source:
      kind: ConfigMap
      name: eso-config
      fieldPath: data.STOCK_TRADER_NAMESPACE
    targets:
      - select:
          kind: ExternalSecret
        fieldPaths:
          - metadata.namespace
