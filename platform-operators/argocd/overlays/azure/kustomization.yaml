# ----------------------------------------------------------------------------------
# ARGOCD OPERATOR — AZURE OVERLAY
# ----------------------------------------------------------------------------------
# Targets AKS clusters running standard OLM (olm namespace).
# The base defaults are correct for AKS — no patches required.
#
# For OpenShift clusters, create an overlays/openshift/ directory and add:
#
#   patches:
#     - target:
#         kind: CatalogSource
#         name: operatorhub-catalog
#       patch: |-
#         - op: replace
#           path: /metadata/namespace
#           value: openshift-marketplace
#     - target:
#         kind: Subscription
#         name: argocd-operator
#       patch: |-
#         - op: replace
#           path: /spec/sourceNamespace
#           value: openshift-marketplace
#
# BOOTSTRAP USAGE:
#   kubectl apply -k platform-operators/argocd/overlays/azure
#   kubectl wait --for=condition=Ready argocd/argocd -n argocd --timeout=300s
#   kubectl apply -f gitops/app-of-apps.yaml
# ----------------------------------------------------------------------------------
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
