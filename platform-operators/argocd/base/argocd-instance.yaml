# ArgoCD instance created by the ArgoCD Operator.
#
# kustomizeBuildOptions enables --enable-helm, required for the ESO helmCharts
# directive in platform-operators/external-secrets/base/kustomization.yaml to function
# when ArgoCD syncs that Application.
#
# Apply only after the ArgoCD operator CSV reaches Succeeded:
#   kubectl wait --for=jsonpath='{.status.phase}'=Succeeded \
#     csv/argocd-operator.v0.12.0 -n argocd --timeout=180s
#   (or: kubectl get csv -n argocd -w)
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: argocd
  namespace: argocd
spec:
  kustomizeBuildOptions: "--enable-helm"
  server:
    service:
      type: ClusterIP
