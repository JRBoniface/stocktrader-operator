# ----------------------------------------------------------------------------------
# ESO CONFIG CONFIGMAP
# ----------------------------------------------------------------------------------
# Infrastructure coordinates used by the Kustomize replacements to populate the
# ClusterSecretStore and ExternalSecret manifests.
#
# These values are non-sensitive (tenant ID, Key Vault URI, namespace names).
# The actual application secrets live in Azure Key Vault — not here.
#
# This file is committed to git so ArgoCD can render the overlay without a local
# config.env file. The matching ConfigMap on the cluster is provisioned by Terraform
# (providers/azure/modules/external_secrets) from the same values.
#
# When infrastructure changes (new Key Vault, new tenant, etc.), update the values
# here AND re-run `terraform apply` to keep the cluster ConfigMap in sync.
# ----------------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: eso-config
  namespace: external-secrets
data:
  TENANT_ID: "147e32ab-2b66-4f09-b4d8-f98e9d3349ae"
  KEY_VAULT_URI: "https://kv-stocktrader-jb-dev.vault.azure.net/"
  SERVICE_ACCOUNT_NAME: "eso-wi"
  ESO_NAMESPACE: "external-secrets"
  CREDENTIALS_SECRET_NAME: "stock-trader-secret-credentials"
  STOCK_TRADER_NAMESPACE: "stock-trader"
