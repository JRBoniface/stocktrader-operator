# ----------------------------------------------------------------------------------
# WAVE 1 — COUCHDB
# ----------------------------------------------------------------------------------
# Deploys CouchDB via the official Apache Helm chart.
# Applied after wave 0 (ESO + couchdb-credentials) is Healthy, which guarantees
# the ClusterSecretStore and the 'couchdb-credentials' Secret both exist.
#
# Chart:   https://github.com/apache/couchdb-helm
# Repo:    https://apache.github.io/couchdb-helm
# Version: 4.6.3 (CouchDB 3.5.1)
#
# Credentials are managed via ExternalSecret (couchdb-credentials Application).
# createAdminSecret is disabled; extraSecretName points at the ESO-managed secret.
#
# NOTE: The fork overlay adds a targeted patch to restore this Application's
# repoURL back to the Helm chart repo after the global git-fork patch runs.
# ----------------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: couchdb-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://apache.github.io/couchdb-helm
    chart: couchdb
    targetRevision: 4.6.3
    helm:
      values: |
        clusterSize: 1
        persistentVolume:
          enabled: true
          size: 10Gi
        createAdminSecret: false
        extraSecretName: couchdb-credentials
  destination:
    server: https://kubernetes.default.svc
    namespace: couchdb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
