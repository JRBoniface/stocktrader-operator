# ----------------------------------------------------------------------------------
# WAVE 0 — COUCHDB CREDENTIALS
# ----------------------------------------------------------------------------------
# Creates the 'couchdb-credentials' Kubernetes Secret in the couchdb namespace by
# fetching admin credentials from Azure Key Vault via the ESO ClusterSecretStore.
#
# Runs at wave 1, after external-secrets-operator (wave 0) is Healthy, which
# guarantees the ExternalSecret CRD and ClusterSecretStore both exist.
# ArgoCD's ExternalSecret health check ensures this Application only becomes
# Healthy once the Secret is fully resolved, blocking wave 2 (couchdb-operator)
# until the credentials are available.
#
# Required Azure Key Vault secrets (create before first sync):
#   couchdb-admin-username
#   couchdb-admin-password
#   couchdb-cookie-auth-secret
# ----------------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: couchdb-credentials
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/IBMStockTrader/stocktrader-operator
    targetRevision: HEAD
    path: platform-operators/couchdb/overlays/azure
  destination:
    server: https://kubernetes.default.svc
    namespace: couchdb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
