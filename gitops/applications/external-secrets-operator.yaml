# ----------------------------------------------------------------------------------
# WAVE 1 — EXTERNAL SECRETS OPERATOR
# ----------------------------------------------------------------------------------
# Installs ESO via Helm (via Kustomize helmCharts) and applies the ClusterSecretStore.
# Applied after CouchDB operator (wave 0) is Healthy.
#
# KNOWN PREREQUISITE — config.env:
#   platform-operators/external-secrets/overlays/config.env is gitignored and must be
#   available to ArgoCD at sync time. The recommended approach is to store the
#   Terraform output values as a Kubernetes Secret post 'terraform apply' and
#   reference them via the ArgoCD Vault plugin or a ConfigManagementPlugin.
#   See gitops/README.md for options.
#
# KNOWN LIMITATION — CRD ordering:
#   The ClusterSecretStore CRD is installed by the ESO Helm chart in this same
#   sync. The first sync may report a partial error for the ClusterSecretStore
#   object. ArgoCD's retry policy will resolve this on the second sync once
#   the CRD is established. This is expected behaviour on first install.
#
# NOTE: --enable-helm is required for kustomize helmCharts support.
#   This is configured automatically in the ArgoCD instance created by
#   platform-operators/argocd/base/argocd-instance.yaml (kustomizeBuildOptions: "--enable-helm").
# ----------------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/IBMStockTrader/stocktrader-operator
    targetRevision: HEAD
    path: platform-operators/external-secrets/overlays
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
