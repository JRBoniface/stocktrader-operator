# ----------------------------------------------------------------------------------
# OPERATORS — ROOT KUSTOMIZATION
# ----------------------------------------------------------------------------------
# Applies all prerequisite operators required by the Stock Trader application.
#
# Usage (two-phase required for ESO CRD ordering):
#
#   Phase 1 — Install operators and CRDs:
#     kubectl apply -k platform-operators --enable-helm
#
#   Wait for CRDs to be established:
#     kubectl wait --for=condition=established --timeout=120s \
#       crd/clustersecretstores.external-secrets.io
#     kubectl wait --for=condition=established --timeout=120s \
#       crd/couchdbclusters.couchdb.apache.org
#
#   Phase 2 — Apply ClusterSecretStore (re-apply is idempotent):
#     kubectl apply -k platform-operators --enable-helm
#
# Prerequisites before running:
#   - OLM installed on the cluster
#   - Terraform applied (module.external_secrets) — ServiceAccount + FIC exist
#   - platform-operators/external-secrets/overlays/azure/config.env populated
#     (see config.env.example for generation instructions)
# ----------------------------------------------------------------------------------
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOTE: platform-operators/argocd/ is intentionally excluded from this kustomization.
# ArgoCD must be bootstrapped first (before it can manage these resources):
#   kubectl apply -k platform-operators/argocd/overlays/azure
#   kubectl wait --for=condition=Ready argocd/argocd -n argocd --timeout=300s
# Then apply gitops/app-of-apps.yaml to hand control to ArgoCD.
# After that, ArgoCD manages the resources below — do not apply this file manually.
resources:
  - couchdb/overlays/azure
  - external-secrets/overlays
