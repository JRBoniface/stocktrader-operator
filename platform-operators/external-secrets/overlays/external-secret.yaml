# ExternalSecret that syncs credentials from Azure Key Vault into the
# stock-trader application namespace.
#
# metadata.name, metadata.namespace, and spec.target.name are empty here —
# they are injected by replacements in the overlay kustomization.yaml
# (sourced from CREDENTIALS_SECRET_NAME and STOCK_TRADER_NAMESPACE in config.env).
#
# Apply only after the ClusterSecretStore reports Ready:
#   kubectl get clustersecretstore azure-kv
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ""
  namespace: ""
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv
  target:
    name: ""
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: cloudant.id
      remoteRef:
        key: cloudant-id
    - secretKey: cloudant.password
      remoteRef:
        key: cloudant-password
    - secretKey: database.id
      remoteRef:
        key: database-id
    - secretKey: database.password
      remoteRef:
        key: database-password
    - secretKey: database.host
      remoteRef:
        key: database-host
    - secretKey: redis.url
      remoteRef:
        key: redis-url
    - secretKey: oidc.clientId
      remoteRef:
        key: oidc-clientId
    - secretKey: oidc.clientSecret
      remoteRef:
        key: oidc-clientSecret
