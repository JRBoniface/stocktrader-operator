# ----------------------------------------------------------------------------------
# ARGOCD APP OF APPS — STOCK TRADER BOOTSTRAP
# ----------------------------------------------------------------------------------
# Root Application that manages all child Applications using sync waves to enforce
# deployment ordering:
#
#   Wave 0 — External Secrets Operator  (Helm chart — installs CRDs + operator)
#   Wave 1 — Stocktrader Operator       (Kustomize / config/default)
#   Wave 2 — Stock Trader Instance      (StockTrader CR)
#
# ArgoCD waits for each wave to reach Healthy before proceeding to the next.
#
# NOTE: CouchDB is deployed as a standalone Helm release outside of ArgoCD.
# See operator/helm-charts/couchdb/README.md for installation instructions.
# CouchDB credentials (ExternalSecret) must be applied manually before deploying CouchDB.
# See operator/helm-charts/external-secrets/README.md.
#
# PREREQUISITES before applying this Application:
#   1. ArgoCD installed on the cluster
#   2. Terraform applied in the infrastructure repository (or az CLI equivalent)
#   3. ESO post-install manifests applied manually (ServiceAccount, ClusterSecretStore,
#      stock-trader ExternalSecret) — see operator/helm-charts/external-secrets/README.md
#      These are applied once before the first ArgoCD sync and are not managed by ArgoCD.
#   4. CouchDB deployed via Helm — see operator/helm-charts/couchdb/README.md
#
# USAGE:
#   Update repoURL below to match your fork, then:
#   kubectl apply -f gitops/app-of-apps.yaml
# ----------------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stocktrader-bootstrap
  namespace: argocd
spec:
  project: default
  source:
    # UPSTREAM (default):
    #   repoURL: https://github.com/IBMStockTrader/stocktrader-operator
    #   path: gitops/applications
    #
    # PERSONAL FORK — two changes required:
    #   1. Set repoURL to your fork below
    #   2. Change path to gitops/overlays/fork
    #      (the fork overlay patches all child Application repoURLs automatically)
    repoURL: https://github.com/JRBoniface/stocktrader-operator
    targetRevision: local-dependencies-extended
    path: gitops/overlays/fork
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
