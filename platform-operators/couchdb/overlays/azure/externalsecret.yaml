# ----------------------------------------------------------------------------------
# COUCHDB CREDENTIALS — EXTERNAL SECRET
# ----------------------------------------------------------------------------------
# Fetches CouchDB admin credentials from Azure Key Vault via ESO and materialises
# them as a Kubernetes Secret named 'couchdb-credentials' in the couchdb namespace.
#
# The CouchDB Helm chart (couchdb-operator Application, wave 1) is configured with:
#   createAdminSecret: false
#   extraSecretName: couchdb-credentials
#
# Required Azure Key Vault secrets (create before first sync):
#   couchdb-admin-username   — CouchDB admin username (e.g. "admin")
#   couchdb-admin-password   — CouchDB admin password (strong random string)
#   couchdb-cookie-auth-secret — Erlang cookie / cookie auth secret (random string)
#
# The ClusterSecretStore 'azure-kv' is created by the external-secrets-operator
# Application (wave 0). This ExternalSecret runs at wave 1, after ESO is Healthy,
# ensuring the CRD and ClusterSecretStore exist. ArgoCD blocks wave 2 (CouchDB Helm)
# until this Application is Healthy (i.e. the Secret is fully resolved).
# ----------------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: couchdb-credentials
  namespace: couchdb
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: couchdb-credentials
    creationPolicy: Owner
  data:
    - secretKey: adminUsername
      remoteRef:
        key: couchdb-admin-username
    - secretKey: adminPassword
      remoteRef:
        key: couchdb-admin-password
    - secretKey: cookieAuthSecret
      remoteRef:
        key: couchdb-cookie-auth-secret
