# ----------------------------------------------------------------------------------
# WAVE 4 — STOCK TRADER INSTANCE
# ----------------------------------------------------------------------------------
# Creates the StockTrader CR that triggers the operator to deploy the application.
# Applied last — after the operator (wave 3) and all prerequisites
# (CouchDB, ESO, credentials secret) are in place.
#
# SkipDryRunOnMissingResource=true prevents ArgoCD from failing the dry-run
# validation when the StockTrader CRD is not yet fully established on the API
# server immediately after the stocktrader-operator Application syncs. The retry
# policy ensures re-attempts until the CRD is ready.
#
# The sample CR at operator/config/samples/operators_v1_stocktrader.yaml must be edited
# to reflect your environment (database host, Redis URL, OIDC config, image tags)
# before this Application is synced.
# ----------------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stocktrader-instance
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/IBMStockTrader/stocktrader-operator
    targetRevision: HEAD
    path: operator/config/samples
  destination:
    server: https://kubernetes.default.svc
    namespace: stock-trader
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
