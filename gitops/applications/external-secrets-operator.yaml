# ----------------------------------------------------------------------------------
# WAVE 0 — EXTERNAL SECRETS OPERATOR
# ----------------------------------------------------------------------------------
# Installs ESO directly via the Helm chart (no Kustomize layer).
#
# Chart:   https://charts.external-secrets.io
# Version: 0.14.0
#
# Post-install manual steps required (not managed by ArgoCD — see README):
#   - ServiceAccount (eso-wi) annotated with UAI client ID
#   - ClusterSecretStore (azure-kv) pointing at Azure Key Vault
#   - ExternalSecrets for stock-trader and couchdb credentials
#
# See helm-charts/external-secrets/README.md for full instructions.
# ----------------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.14.0
    helm:
      values: |
        installCRDs: true
        webhook:
          networkPolicy:
            enabled: false
        certController:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
