# ----------------------------------------------------------------------------------
# WAVE 3 — STOCKTRADER OPERATOR
# ----------------------------------------------------------------------------------
# Deploys the stocktrader operator manager, CRD, and RBAC via config/default.
# Applied after CouchDB is Healthy (wave 2), ensuring the database is running
# before the operator starts managing StockTrader CRs.
#
# NOTE: This deploys the operator directly via Kustomize, bypassing OLM.
#   For OLM-managed installation instead, replace 'path: operator/config/default' with
#   a path pointing to the CatalogSource + Subscription manifests.
#   See operator/catalog-source.yaml and operator/subscription.yaml for reference.
# ----------------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stocktrader-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/IBMStockTrader/stocktrader-operator
    targetRevision: HEAD
    path: operator/config/default
  destination:
    server: https://kubernetes.default.svc
    # namespace intentionally omitted — the kustomize 'namespace: stocktrader-operator-system'
    # directive in config/default/kustomization.yaml scopes all namespaced resources.
    # Leaving this empty allows ArgoCD to also sync cluster-scoped resources
    # (ClusterRole, ClusterRoleBinding, CRD) without "namespaced mode" rejection.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
