# ClusterSecretStore pointing to Azure Key Vault via Workload Identity.
# Field values are intentionally empty — they are injected by the overlay
# replacements sourced from config.env (generated from Terraform outputs).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-kv
spec:
  provider:
    azurekv:
      tenantId: ""
      vaultUrl: ""
      authType: WorkloadIdentity
      serviceAccountRef:
        name: ""
        namespace: ""
