# ----------------------------------------------------------------------------------
# ARGOCD OPERATOR — BASE
# ----------------------------------------------------------------------------------
# Installs ArgoCD via the ArgoCD Operator (OLM) and creates an ArgoCD instance.
#
# BOOTSTRAP NOTE:
#   ArgoCD must exist before it can manage other resources — this directory is
#   therefore applied as a one-time bootstrap step BEFORE the gitops/ Applications
#   are used. It is intentionally NOT included in platform-operators/kustomization.yaml
#   (which ArgoCD itself will manage after bootstrapping).
#
# TWO-PHASE APPLY REQUIRED:
#   The ArgoCD Operator installs the 'ArgoCD' CRD via OLM. Applying the ArgoCD
#   instance CR in the same kubectl apply as the Subscription will fail with
#   "no matches for kind ArgoCD" because the CRD does not exist yet.
#
# Phase 1 — install the operator (this kustomization):
#   kubectl apply -k platform-operators/argocd/overlays/azure
#
# Wait for the operator CSV to reach Succeeded (ensures webhook is ready):
#   kubectl get csv -n argocd -w
#   # or: kubectl wait --for=jsonpath='{.status.phase}'=Succeeded \
#   #       csv/argocd-operator.v0.12.0 -n argocd --timeout=180s
#
# Phase 2 — create the ArgoCD instance:
#   kubectl apply -f platform-operators/argocd/base/argocd-instance.yaml
#
# Wait for ArgoCD to be ready before proceeding:
#   kubectl wait --for=condition=Ready argocd/argocd -n argocd --timeout=300s
#
# Resources applied in phase 1:
#   1. Namespace         — creates the argocd namespace
#   2. CatalogSource     — registers OperatorHub community catalog with OLM
#   3. OperatorGroup     — scopes the operator to the argocd namespace
#   4. Subscription      — instructs OLM to install the ArgoCD operator
# ----------------------------------------------------------------------------------
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# argocd-instance.yaml is intentionally excluded — apply it separately after
# the ArgoCD CRD is established (see TWO-PHASE APPLY note above).
resources:
  - namespace.yaml
  - catalog-source.yaml
  - operator-group.yaml
  - subscription.yaml
  - cluster-role-binding.yaml
