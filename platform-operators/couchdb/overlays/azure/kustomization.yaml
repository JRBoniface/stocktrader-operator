# ----------------------------------------------------------------------------------
# COUCHDB CREDENTIALS — AZURE OVERLAY
# ----------------------------------------------------------------------------------
# Deploys the ExternalSecret that materialises CouchDB admin credentials from
# Azure Key Vault into the couchdb namespace.
#
# This kustomization is the source for the 'couchdb-credentials' ArgoCD
# Application (wave 0). The CouchDB Helm chart (wave 1) depends on this
# Application being Healthy before it syncs.
#
# Required Azure Key Vault secrets (create before first sync):
#   couchdb-admin-username
#   couchdb-admin-password
#   couchdb-cookie-auth-secret
# ----------------------------------------------------------------------------------
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - externalsecret.yaml
