# ----------------------------------------------------------------------------------
# COUCHDB OPERATOR — BASE
# ----------------------------------------------------------------------------------
# Installs the CouchDB Operator via OLM (Operator Lifecycle Manager).
# Resources applied in dependency order:
#   1. CatalogSource     — registers the CouchDB operator catalog with OLM (in olm ns)
#   2. OperatorGroup     — scopes the operator to the couchdb namespace
#   3. Subscription      — instructs OLM to install the CouchDB operator
#
# NOTE: The couchdb Namespace is pre-created in the ArgoCD bootstrap
# (platform-operators/argocd/base/managed-namespaces.yaml) with the required
# argocd.argoproj.io/managed-by label. It is intentionally excluded here because
# ArgoCD in namespaced-mode cannot sync cluster-scoped Namespace resources.
#
# Usage:
#   kubectl apply -k platform-operators/couchdb/overlays/azure
#
# Wait for the operator to be ready before creating CouchDBCluster CRs:
#   kubectl wait --for=condition=established --timeout=120s \
#     crd/couchdbclusters.couchdb.apache.org
# ----------------------------------------------------------------------------------
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - catalog-source.yaml
  - operator-group.yaml
  - subscription.yaml
